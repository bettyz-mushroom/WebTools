<!DOCTYPE html>
<html lang="en">
  <head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300..700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/p5@2.3.2/lib/p5.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5.sound@0.4.1/dist/p5.sound.min.js"></script>

    <link rel="stylesheet" type="text/css" href="style.css" />
    <meta charset="utf-8" />
  </head>
  <body>
    <h1>Gradient Tool</h1>
    
    
    <p>Adjust color A and color B by changing the slider values!</p>
    <div class="tool-container">
      <div class="controls">
        <div class="color-group">
          <p>Color A</p>
          <div class="slider-row">
          <label>H</label>
          <input
            id="ahInput"
            type="range"
            min="0"
            max="360"
            step="1"
            value="0"
          />
            </div><!-- slider-row -->
          <div class="slider-row">
          <label>S</label>
          <input
            id="asInput"
            type="range"
            min="0"
            max="100"
            step="1"
            value="0"
          />
            </div><!-- slider-row -->
          <div class="slider-row">
          <label>L</label>
          <input
            id="alInput"
            type="range"
            min="0"
            max="100"
            step="1"
            value="0"
          />
          </div><!-- slider-row /-->
          </div><!-- color-group <-->
        <div class="color-group">
          <p>Color B</p>
          <div class="slider-row">
          <label>H</label>
          <input
            id="bhInput"
            type="range"
            min="0"
            max="360"
            step="1"
            value="0"
          />
            </div><!-- slider-row /-->
          <div class="slider-row">
          <label>S</label>
          <input
            id="bsInput"
            type="range"
            min="0"
            max="100"
            step="1"
            value="0"
          />
            </div><!-- slider-row /-->
          <div class="slider-row">
          <label>L</label>
          <input
            id="blInput"
            type="range"
            min="0"
            max="100"
            step="1"
            value="0"
          />
            </div><!-- slider-row /-->
          </div><!-- color-group -->
       
        <button id="downloadButton">Save</button>
      </div><!-- controls -->
      <div class="preview-column">
  <main id="canvas-area"></main>
  <button id="labelButton">Hide Labels</button>
</div><!-- preview-column /-->
    </div><!-- tool- container -->
    <script src="tool.js"></script>
    <script src="sketch.js"></script>
  </body>
</html>
